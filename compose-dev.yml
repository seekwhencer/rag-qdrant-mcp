services:
  rag-qdrant-mcp:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: rag-qdrant-mcp
    restart: unless-stopped
    command: ["npm", "run", "dev"]
    working_dir: /app/server
    ports:
      - ${SERVER_PORT}:${SERVER_PORT}
    volumes:
      - ./server:/app/server
      - ./frontend:/app/frontend
      - /app/server/node_modules
      - /app/frontend/node_modules
      - ./storage:/storage
      - ./data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - NODE_ENV=development
      - VITE_WS_PORT=${SERVER_PORT}
      - SERVER_PORT=${SERVER_PORT}
      - STORAGE_ROOT=/storage
      - DATA_DIR=/data
      - CONFIG_PATH=/data/config.json
      - STORAGE_CONCURRENCY=${STORAGE_CONCURRENCY:-1}
      - STORAGE_DUMMY_DELAY_SEC=${STORAGE_DUMMY_DELAY_SEC:-2}
      - STORAGE_RETRY_DELAY_SEC=${STORAGE_RETRY_DELAY_SEC:-5}
      - STORAGE_MAX_RETRIES=${STORAGE_MAX_RETRIES:-3}
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_USER=${DB_USER:-rag}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-ragqdrant}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
