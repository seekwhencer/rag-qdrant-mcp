<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="RAG + Qdrant + MCP" />
  <title>rag-qdrant-mcp</title>
  <script>
    // Persisted theme applied before first paint (no FOUC).
    (function () {
      try {
        var t = localStorage.getItem('ui.theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t;
        }
      } catch (e) {
        /* ignore */
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
