
services:
  docling:
    image: quay.io/docling-project/docling-serve:latest
    container_name: rag-qdrant-mcp-docling
    restart: unless-stopped

    ports:
      - "5001:5001"

    environment:
      DOCLING_SERVE_ENABLE_UI: "true"

    volumes:
      - ./data/docling/cache:/root/.cache

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
